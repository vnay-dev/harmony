name: harmony
description: "A Shruti app (pitch drone) for everyone."
publish_to: 'none'

# Versions represent releases, not commits. See .cursor/rules/versioning.mdc.
version: 0.0.1+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.4
  just_audio: ^0.10.6
  material_symbols_icons: ^4.2874.0
  pitch_detector_dart: ^0.0.7
  record: ^6.2.1
  speech_to_text: ^7.4.0
  google_fonts: ^8.2.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/pa/
    - assets/audio/pilot/
    - assets/audio/tutor/
